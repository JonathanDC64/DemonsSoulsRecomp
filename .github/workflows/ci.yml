# Checks the parts of this repository that build or run without the game (docs/54). des_boot needs the
# lift, which only a copy of the game can make, so CI never builds it. The game-derived file check is
# game-files.yml; the runtime has its own CI in the ps3recomp fork. One job per system: each installs what
# it needs once and runs every check that needs it. host.yml builds des_host, which compiles the wrapper UI
# too, and runs setup's tests on Linux.
name: CI

on:
  push:
    branches: [ master ]
    paths-ignore: [ 'docs/**', '**.md' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new commit on a pull request (or a new push to master) cancels the run it replaces.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # des_ui as des_boot links it (the release C runtime). On a pull request, host.yml's des_host.exe job compiles
  # the same sources (with the static one), so this one runs on pushes to master and manual runs only.
  ui:
    name: Wrapper UI (Windows, clang-cl)
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # clang-cl compiles, but needs the MSVC headers, libraries and the Windows SDK on the path.
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja --version=1.13.2 --allow-downgrade -y --no-progress

      - name: Show toolchain
        run: |
          clang-cl --version
          cmake --version
          ninja --version

      # port/ui is its own static library (start screen, menu, settings, crash and issue reports) with
      # FreeType and RmlUi fetched at configure time. des_boot only links it, so it builds here alone,
      # configured like the port in README.md (no build type: no Debug flags, the release C runtime).
      - name: Configure
        run: >
          cmake -S .github/ci/des_ui -B build/ui -G Ninja
          -DCMAKE_C_COMPILER=clang-cl
          -DCMAKE_CXX_COMPILER=clang-cl
          -DCMAKE_BUILD_TYPE=
          -DCMAKE_CXX_FLAGS_DEBUG=
          -DCMAKE_C_FLAGS_DEBUG=

      - name: Build
        run: cmake --build build/ui

      - name: Verify the library exists
        shell: bash
        run: |
          ls -la build/ui/des_ui/des_ui.lib
          test -s build/ui/des_ui/des_ui.lib

  # Linux, Ubuntu 24.04, clang: the wrapper UI library, where it draws through D3D12 on vkd3d and takes SDL's mouse
  # and the POSIX crash reports (docs/76), files the Windows build never compiles; then the game build description
  # (below). vkd3d comes from its release tarball (Ubuntu's 1.2 has no HLSL compiler) and is cached on its version.
  #
  # Setup compiles the game part from game_build.json (Windows) and game_build_linux.json (Linux): CMake's commands
  # for des_game (DES_SPLIT=ON DES_SPLIT_FREESTANDING=ON) with the paths as placeholders (scripts/game_build_desc.py).
  # These checks configure the port with empty files where the lift goes (CI never has it) and check that each
  # description still matches CMake's commands. The headers list needs a real build, so it is left out
  # (--commands-only). CMake is the version each description was written with, so a CMake update cannot fail the
  # check: 4.3.3 (Kitware's) on Windows, Ubuntu 24.04's 3.28.3 on Linux. After a change to the game part's flags,
  # write the description again with game_build_desc.py (docs/86, docs/87).
  linux:
    name: Wrapper UI and game build description (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VKD3D_VERSION: "2.1"
      VKD3D_SHA256: 7510146aff2adfb4ae07ab890701a607e5ff7c66e57100cfc9f630ec92eeda6a
      # The prefix is inside the workspace: actions/cache refuses a path with '..' in it, and saved nothing while these were beside it.
      VKD3D_PREFIX: ${{ github.workspace }}/.ci-cache/vkd3d
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.9'

      # vkd3d's build needs flex, bison, Perl's JSON module and the SPIR-V headers. Ubuntu's own cmake (3.28.3) goes
      # to /usr/bin for the description: the runner's newer one stays first on PATH for the UI.
      - name: Install dependencies
        id: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config clang libsdl2-dev libvulkan-dev \
            flex bison libjson-perl spirv-headers
          /usr/bin/cmake --version

      - name: Cache vkd3d
        id: vkd3d-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.VKD3D_PREFIX }}
          key: vkd3d-${{ env.VKD3D_VERSION }}-${{ runner.os }}-ubuntu-24.04-v1

      - name: Build vkd3d
        id: vkd3d
        if: steps.vkd3d-cache.outputs.cache-hit != 'true'
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://dl.winehq.org/vkd3d/source/vkd3d-$VKD3D_VERSION.tar.xz"
          echo "$VKD3D_SHA256  vkd3d-$VKD3D_VERSION.tar.xz" | sha256sum -c -
          tar xf "vkd3d-$VKD3D_VERSION.tar.xz"
          cd "vkd3d-$VKD3D_VERSION"
          ./configure -q --prefix="$VKD3D_PREFIX" --disable-doxygen-doc
          make -s -j"$(nproc)"
          make -s install

      - name: Wrapper UI, configure
        run: |
          PKG_CONFIG_PATH="$VKD3D_PREFIX/lib/pkgconfig" CC=clang CXX=clang++ \
            cmake -S .github/ci/des_ui -B build/ui -G Ninja -DCMAKE_BUILD_TYPE=

      - name: Wrapper UI, build
        run: cmake --build build/ui

      - name: Wrapper UI, verify the library exists
        run: |
          ls -la build/ui/des_ui/libdes_ui.a
          test -s build/ui/des_ui/libdes_ui.a

      # The description runs after the UI failed too. As host.yml: the pinned commit of the fork, beside port/.
      - name: Read the ps3recomp pin
        id: pin
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && steps.vkd3d.outcome != 'failure' }}
        run: python .github/scripts/read_pin.py >> "$GITHUB_OUTPUT"

      - name: Check out the pinned ps3recomp
        id: ps3recomp
        if: ${{ !cancelled() && steps.pin.outcome == 'success' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ steps.pin.outputs.repo }}
          ref: ${{ steps.pin.outputs.commit }}
          path: ps3recomp
          persist-credentials: false

      - name: Game build description, empty files where the lift goes
        id: lift
        if: ${{ !cancelled() && steps.ps3recomp.outcome == 'success' }}
        run: python .github/scripts/placeholder_lift.py "$RUNNER_TEMP/lift" >> "$GITHUB_ENV"

      # As the description was written (docs/87): clang, no build type, Ubuntu's cmake.
      - name: Game build description, configure
        id: desc-cfg
        if: ${{ !cancelled() && steps.lift.outcome == 'success' }}
        run: |
          PKG_CONFIG_PATH="$VKD3D_PREFIX/lib/pkgconfig" CC=clang CXX=clang++ \
            /usr/bin/cmake -S port -B build/desc -G Ninja -DCMAKE_BUILD_TYPE= "-DRECOMP_DIR=$DES_LIFT" \
            -DDES_VKD3D=ON -DDES_SPLIT=ON -DDES_SPLIT_FREESTANDING=ON

      - name: game_build_linux.json matches CMake's commands
        if: ${{ !cancelled() && steps.desc-cfg.outcome == 'success' }}
        run: python scripts/game_build_desc.py build/desc --check --commands-only

  # Windows: setup's engine tests (tools/setup) on Windows, one of the systems players run it on, with Python 3.13,
  # setup's own line (the 3.13.9 embeddable package; host.yml runs them on Linux at the glibc floor, docs/87); then
  # the game build description (above).
  windows:
    name: Setup tests and game build description (Windows)
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CMAKE_VERSION: 4.3.3
      CMAKE_ZIP_SIZE: '52967828'
      CMAKE_ZIP_SHA256: 935ade9e5e8723583c07f44c5592cea2a1c8f65c56ca7e07b34c025c880e0bd6
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.9'

      # First, before the MSVC environment and CMake 4.3.3 are on PATH, as setup's own job had it. PowerShell, as
      # players' Windows runs setup.
      - name: Setup engine tests
        shell: pwsh
        working-directory: tools/setup
        run: python -m unittest discover -s tests

      # The description runs after the tests failed too. As in host.yml: the pinned commit of the fork, beside port/.
      - name: Read the ps3recomp pin
        id: pin
        if: ${{ !cancelled() }}
        run: python .github/scripts/read_pin.py >> "$GITHUB_OUTPUT"

      - name: Check out the pinned ps3recomp
        id: ps3recomp
        if: ${{ !cancelled() && steps.pin.outcome == 'success' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ steps.pin.outputs.repo }}
          ref: ${{ steps.pin.outputs.commit }}
          path: ps3recomp
          persist-credentials: false

      - name: Set up MSVC environment
        id: msvc
        if: ${{ !cancelled() && steps.ps3recomp.outcome == 'success' }}
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: CMake ${{ env.CMAKE_VERSION }} and Ninja
        id: cmake
        if: ${{ !cancelled() && steps.msvc.outcome == 'success' }}
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 5 --retry-all-errors -o cmake.zip \
            "https://github.com/Kitware/CMake/releases/download/v$CMAKE_VERSION/cmake-$CMAKE_VERSION-windows-x86_64.zip"
          [ "$(stat -c %s cmake.zip)" = "$CMAKE_ZIP_SIZE" ] || { echo "::error::cmake.zip has the wrong size"; exit 1; }
          echo "$CMAKE_ZIP_SHA256  cmake.zip" | sha256sum -c -
          unzip -q cmake.zip
          echo "$RUNNER_TEMP/cmake-$CMAKE_VERSION-windows-x86_64/bin" >> "$GITHUB_PATH"
          choco install ninja --version=1.13.2 --allow-downgrade -y --no-progress

      - name: Empty files where the lift goes
        id: lift
        if: ${{ !cancelled() && steps.cmake.outcome == 'success' }}
        run: python .github/scripts/placeholder_lift.py "$RUNNER_TEMP/lift" >> "$GITHUB_ENV"

      # As the description was written (docs/86): no build type, no developer code.
      - name: Configure
        id: desc-cfg
        if: ${{ !cancelled() && steps.lift.outcome == 'success' }}
        run: >
          cmake -S port -B build/desc -G Ninja
          -DCMAKE_C_COMPILER=clang-cl
          -DCMAKE_CXX_COMPILER=clang-cl
          -DCMAKE_BUILD_TYPE=
          -DCMAKE_CXX_FLAGS_DEBUG=
          -DCMAKE_C_FLAGS_DEBUG=
          "-DRECOMP_DIR=$DES_LIFT"
          -DDES_SPLIT=ON
          -DDES_SPLIT_FREESTANDING=ON
          -DDES_DEV=OFF

      - name: game_build.json matches CMake's commands
        if: ${{ !cancelled() && steps.desc-cfg.outcome == 'success' }}
        run: python scripts/game_build_desc.py build/desc --check --commands-only


  scripts:
    name: Scripts (syntax, icon step)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # A fixed version, so a runner image update does not change what "compiles" means.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Python syntax
        run: git ls-files -z '*.py' | xargs -0 python -m py_compile

      - name: Shell syntax
        run: |
          fail=0
          for f in $(git ls-files '*.sh'); do
            bash -n "$f" || { echo "::error file=$f::bash -n failed"; fail=1; }
          done
          exit $fail

      # Every build with the game's PS3_GAME/ICON0.PNG makes the exe's icon with scripts/make_icon.py.
      # Here it gets a made-up picture of the same shape (320x176) and must write all six sizes.
      - name: Icon step on a made-up picture
        run: |
          python - <<'EOF'
          import struct, subprocess, sys, zlib
          w, h = 320, 176
          rows = b"".join(b"\x00" + bytes(v for x in range(w) for v in (x * 255 // w, y * 255 // h, 128, 255))
                          for y in range(h))
          def chunk(kind, body):
              return struct.pack(">I", len(body)) + kind + body + struct.pack(">I", zlib.crc32(kind + body))
          with open("made_up.png", "wb") as f:
              f.write(b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 6, 0, 0, 0))
                      + chunk(b"IDAT", zlib.compress(rows)) + chunk(b"IEND", b""))
          subprocess.run([sys.executable, "scripts/make_icon.py", "made_up.png", "made_up.ico"], check=True)
          d = open("made_up.ico", "rb").read()
          reserved, kind, count = struct.unpack("<HHH", d[:6])
          sizes = [d[6 + 16 * i] or 256 for i in range(count)]
          assert (reserved, kind) == (0, 1), "not an icon file"
          assert sizes == [256, 64, 48, 32, 24, 16], sizes
          print("icon sizes:", sizes)
          EOF
