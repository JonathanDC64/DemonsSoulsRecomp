# Checks ps3recomp.pin, the one ps3recomp commit (and, for a release, the fork's tag) this port builds with
# (docs/54): the file's format, that the commit is on the fork's master, and that the tag points to it.
# A pull request that moves the pin to a commit of an unmerged ps3recomp pull request fails here until that
# one merges; the run on master after both merges is the one that counts.
name: ps3recomp pin

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pin:
    name: Pinned ps3recomp commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Self-test
        run: python tools/release/pin_ps3recomp.py self-test

      - name: Pin against the fork
        run: python tools/release/pin_ps3recomp.py check --remote
