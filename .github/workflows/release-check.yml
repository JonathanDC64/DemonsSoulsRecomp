# The release workflow's steps on a pull request that changes them (docs/54), with no tag and nothing created: the
# notes, the zip (made twice, which must come out the same) and the game-file check of what it holds.
name: Release dry run

on:
  pull_request:
    paths:
      - 'tools/release/**'
      - '.github/workflows/release*.yml'
      - 'ps3recomp.pin'
      - 'VERSION'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    name: Package without releasing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Release notes
        run: |
          python tools/release/changelog.py --out dist/notes.md
          cat dist/notes.md

      # With stand-ins for host.yml's des_host.exe and its Linux host folder: the player's zip and the Linux tarball
      # are made around them the same way, and the program must land at the top of its tree (the Linux one
      # executable).
      - name: Package, twice
        run: |
          mkdir -p host host-linux/licenses/SDL2 && printf 'stand-in' > host/des_host.exe
          printf 'stand-in' > host-linux/des_host && printf 'stand-in' > host-linux/libSDL2-2.0.so.0
          printf 'stand-in' > host-linux/licenses/SDL2/LICENSE.txt
          for out in dist dist2; do
            python tools/release/package.py build --rev HEAD --host host/des_host.exe --linux-host host-linux \
              --out "$out" --dry-run
          done
          cmp dist/SHA256SUMS dist2/SHA256SUMS
          cat dist/SHA256SUMS
          unzip -l dist/DemonsSoulsRecomp-*-windows.zip | grep -E ' DemonsSoulsRecomp-[^/]+/des_host\.exe$'
          tar -tvJf dist/DemonsSoulsRecomp-*-linux.tar.xz | grep -E '^-rwxr-xr-x .* DemonsSoulsRecomp-[^/]+/des_host$'
          tar -tvJf dist/DemonsSoulsRecomp-*-linux.tar.xz | grep -E ' DemonsSoulsRecomp-[^/]+/licenses/SDL2/LICENSE\.txt$'
          tar -xOJf dist/DemonsSoulsRecomp-*-linux.tar.xz --wildcards '*/release-files.txt' | grep -x 'des_host'

      - name: No game-derived files in the package
        run: |
          if [ -f .github/scripts/check_game_files.py ]; then
            python .github/scripts/check_game_files.py --dir dist/stage
          else
            echo "::notice::.github/scripts/check_game_files.py is not on this branch yet; skipped"
          fi
