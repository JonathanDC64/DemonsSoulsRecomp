# The release workflow's steps on a pull request that changes them (docs/54), with no tag and nothing created: the
# notes, the zip (made twice, which must come out the same) and the game-file check of what it holds.
name: Release dry run

on:
  pull_request:
    paths:
      - 'tools/release/**'
      - '.github/workflows/release*.yml'
      - 'ps3recomp.pin'
      - 'VERSION'
  workflow_dispatch:

permissions:
  contents: read

# A new commit on the pull request cancels the run it replaces.
concurrency:
  group: release-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dry-run:
    name: Package without releasing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Release notes
        run: |
          python tools/release/changelog.py --out dist/notes.md
          cat dist/notes.md

      # With stand-ins for host.yml's des_host.exe folder and its Linux host folder: the player's zip and the Linux
      # tarball are made around them the same way, and the program must land at the top of its tree under its name
      # (the Linux one executable), FFmpeg's DLLs and licence beside the Windows one, setup's files in setup/, and
      # none of the rest of the tree; the maps go in the symbols zip.
      - name: Package, twice
        run: |
          mkdir -p host/licenses/ffmpeg host-linux/licenses/SDL2 && printf 'stand-in' > host/des_host.exe
          printf 'stand-in' > host/des_host.map && printf 'stand-in' > host-linux/des_host.map
          printf 'stand-in' > host/avcodec-62.dll && printf 'stand-in' > host/avutil-60.dll
          printf 'stand-in' > host/licenses/ffmpeg/COPYING.LGPLv2.1
          printf 'stand-in' > host-linux/des_host && printf 'stand-in' > host-linux/libSDL2-2.0.so.0
          printf 'stand-in' > host-linux/licenses/SDL2/LICENSE.txt
          for out in dist dist2; do
            python tools/release/package.py build --rev HEAD --host host/des_host.exe --linux-host host-linux \
              --out "$out" --dry-run
          done
          cmp dist/SHA256SUMS dist2/SHA256SUMS
          cat dist/SHA256SUMS
          program=$(tr -d '\r\n' < PRODUCT_NAME)
          unzip -l dist/DemonsSoulsRecomp-*-windows.zip | grep -E " DemonsSoulsRecomp-[^/]+/$program\.exe\$"
          unzip -l dist/DemonsSoulsRecomp-*-windows.zip | grep -E ' DemonsSoulsRecomp-[^/]+/setup/tools/setup/run_setup\.py$'
          ! unzip -l dist/DemonsSoulsRecomp-*-windows.zip | grep -E ' DemonsSoulsRecomp-[^/]+/(port|ps3recomp|scripts|tools|des_host)'
          unzip -l dist/DemonsSoulsRecomp-*-symbols.zip | grep -E '/windows/des_host\.map$'
          unzip -l dist/DemonsSoulsRecomp-*-symbols.zip | grep -E '/linux/des_host\.map$'
          unzip -l dist/DemonsSoulsRecomp-*-windows.zip | grep -E ' DemonsSoulsRecomp-[^/]+/avcodec-62\.dll$'
          unzip -l dist/DemonsSoulsRecomp-*-windows.zip | grep -E ' DemonsSoulsRecomp-[^/]+/licenses/ffmpeg/COPYING\.LGPLv2\.1$'
          unzip -p dist/DemonsSoulsRecomp-*-windows.zip '*/release-files.txt' | grep -x 'avutil-60.dll'
          unzip -p dist/DemonsSoulsRecomp-*-windows.zip '*/release-info.txt' | grep -x "exe=$program.exe"
          tar -tvJf dist/DemonsSoulsRecomp-*-linux.tar.xz | grep -E "^-rwxr-xr-x .* DemonsSoulsRecomp-[^/]+/$program\$"
          tar -tvJf dist/DemonsSoulsRecomp-*-linux.tar.xz | grep -E ' DemonsSoulsRecomp-[^/]+/licenses/SDL2/LICENSE\.txt$'
          tar -xOJf dist/DemonsSoulsRecomp-*-linux.tar.xz --wildcards '*/release-files.txt' | grep -x "$program"
          # The lift's tools from the packaged tree: each starts (what it imports is there), and the names they find
          # in the fork's modules are the same as from the whole tree.
          mkdir unpacked && unzip -q dist/DemonsSoulsRecomp-*-windows.zip -d unpacked
          tree=$(echo unpacked/DemonsSoulsRecomp-*/setup)
          for s in ps3recomp/tools/ppu_loader ps3recomp/tools/ppu_lifter ps3recomp/tools/spu_lifter \
                   ps3recomp/tools/lift_prx ps3recomp/tools/gen_hle_nids scripts/build_spu scripts/build_libsre; do
            python "$tree/$s.py" --help > /dev/null
          done
          python dist/stage/DemonsSoulsRecomp-*/ps3recomp/tools/gen_hle_nids.py --all --out names-whole.cpp
          python "$tree/ps3recomp/tools/gen_hle_nids.py" --all --out names-packaged.cpp
          cmp names-whole.cpp names-packaged.cpp

      - name: Third-party sources
        run: python tools/release/third_party_sources.py --check

      - name: No game-derived files in the package
        run: |
          if [ -f .github/scripts/check_game_files.py ]; then
            python .github/scripts/check_game_files.py --dir dist/stage
          else
            echo "::notice::.github/scripts/check_game_files.py is not on this branch yet; skipped"
          fi
