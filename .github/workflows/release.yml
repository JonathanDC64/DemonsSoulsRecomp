# Drafts a GitHub release when a version tag is pushed (docs/54): v0.1.0, or a pre-release such as v0.1.0-rc.1.
# Nothing else starts it: no manual run, no branch push. The release stays a draft, unpublished, until the
# maintainer reads it and publishes it by hand. tools/release/package.py and changelog.py do the work, and
# release-check.yml runs them on pull requests that change them.
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write   # to create the draft release

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # des_host.exe for the player's zip and the Linux host folder for the Linux tarball, built from the tag by host.yml
  # itself (its checks included).
  host:
    name: The host exe
    uses: ./.github/workflows/host.yml
    permissions:
      contents: read

  draft:
    name: Draft the release
    needs: host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # every tag and master: the tag checks and the notes need the history

      # The zip's deflate output depends on the zlib Python carries: a fixed version keeps it reproducible.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: The tag is v<VERSION>, on master, with a pinned ps3recomp release
        run: python tools/release/package.py check-tag "$GITHUB_REF_NAME"

      - name: The pin against the fork
        run: |
          if [ ! -f tools/release/pin_ps3recomp.py ]; then
            echo "::error::tools/release/pin_ps3recomp.py is missing: a release needs the ps3recomp pin (docs/54)"
            exit 1
          fi
          python tools/release/pin_ps3recomp.py check --remote --release

      - name: Release notes
        run: python tools/release/changelog.py --to "$GITHUB_REF_NAME" --out dist/notes.md

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: des_host-${{ github.sha }}
          path: host

      # The Linux host folder (des_host, the SDL2 and vkd3d libraries beside it, their licences), for the Linux tarball.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: des_host-linux-${{ github.sha }}
          path: host-linux

      - name: Package
        run: >
          python tools/release/package.py build --rev "$GITHUB_REF_NAME" --host host/des_host.exe
          --linux-host host-linux --out dist

      - name: No game-derived files in the package
        run: |
          if [ ! -f .github/scripts/check_game_files.py ]; then
            echo "::error::.github/scripts/check_game_files.py is missing: a release needs the game-file check (docs/54)"
            exit 1
          fi
          python .github/scripts/check_game_files.py --dir dist/stage
          python .github/scripts/check_game_files.py --dir host --allow .github/game-files-allow.txt \
            --allow .github/host-files-allow.txt
          python .github/scripts/check_game_files.py --dir host-linux --allow .github/game-files-allow.txt \
            --allow .github/host-files-allow.txt

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          gh release create "$TAG" --draft --verify-tag $pre --title "DemonsSoulsRecomp ${TAG#v}" \
            --notes-file dist/notes.md dist/DemonsSoulsRecomp-*-source.zip dist/DemonsSoulsRecomp-*-windows.zip \
            dist/DemonsSoulsRecomp-*-linux.tar.xz dist/SHA256SUMS
